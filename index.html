<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Store Premium</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #f3f4f6;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 12px;
            font-size: 15px;
            color: #f3f4f6;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        /* Menghilangkan panah input type number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Desain Keren untuk Pilihan Pembayaran */
        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .payment-card {
            background: #030712;
            border: 2px solid #1f2937;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
        }

        .payment-card span {
            font-size: 11px;
            font-weight: 400;
            color: #6b7280;
            margin-top: 2px;
        }

        .payment-card:hover {
            border-color: #3b82f6;
            color: #fff;
        }

        /* Gaya ketika opsi dipilih */
        .payment-card.selected {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.05);
            color: #22c55e;
        }

        .payment-card.selected span {
            color: #4ade80;
        }

        .btn-order {
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.25);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
        }

        .footer-note {
            font-size: 11px;
            color: #4b5563;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
    <h2>SMM STORE</h2>
    <p class="subtitle">Premium Boost Followers & Channel Subs</p>
    
    <form id="orderForm">
        <div class="form-group">
            <label for="platform">Pilih Layanan</label>
            <select id="platform" required>
                <option value="">-- Pilih Layanan --</option>
                <option value="Instagram Followers">Instagram Followers</option>
                <option value="TikTok Followers">TikTok Followers</option>
                <option value="WhatsApp Channel Subscribers">WhatsApp Channel (Tambah Pengikut)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jumlah">Jumlah Order</label>
            <input type="number" id="jumlah" placeholder="Contoh: 1000" min="1" required>
        </div>

        <div class="form-group">
            <label for="target">Target (Link Channel / Username)</label>
            <input type="text" id="target" placeholder="Contoh: link saluran WA atau @user" required>
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <div class="payment-options">
                <div class="payment-card" onclick="selectPayment(this, 'QRIS')">
                    📸 QRIS
                    <span>Instant Scan</span>
                </div>
                <div class="payment-card" onclick="selectPayment(this, 'SeaBank')">
                    🏦 SeaBank
                    <span>Transfer Bank</span>
                </div>
            </div>
        </div>

        <button type="button" class="btn-order" onclick="kirimKeWhatsApp()">Kirim Orderan via WA</button>
    </form>
    
    <p class="footer-note">Klik tombol di atas untuk langsung terhubung dengan WhatsApp admin.</p>
</div>

<script>
    let selectedPaymentMethod = "";

    function selectPayment(element, method) {
        // Hapus kelas 'selected' dari semua opsi pembayaran
        const cards = document.querySelectorAll('.payment-card');
        cards.forEach(card => card.classList.remove('selected'));
        
        // Tambahkan kelas 'selected' ke opsi yang diklik
        element.classList.add('selected');
        selectedPaymentMethod = method;
    }

    function kirimKeWhatsApp() {
        const platform = document.getElementById('platform').value;
        const jumlah = document.getElementById('jumlah').value;
        const target = document.getElementById('target').value;
        
        const nomorWA = "6285122662877";

        if (!platform || !jumlah || !target || !selectedPaymentMethod) {
            alert("⚠️ Lengkapi data dan pilih metode pembayaran dulu bos!");
            return;
        }

        // Menyusun teks pesan WhatsApp
        const teksPesan = `Halo Admin, saya mau order layanan SMM.%0A%0A` +
                          `• *Layanan:* ${platform}%0A` +
                          `• *Jumlah:* ${jumlah}%0A` +
                          `• *Target:* ${target}%0A` +
                          `• *Metode Bayar:* ${selectedPaymentMethod}%0A%0A` +
                          `Tolong kirimkan data pembayarannya ya, terima kasih!`;

        const urlWhatsApp = `https://api.whatsapp.com/send?phone=${nomorWA}&text=${teksPesan}`;

        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
